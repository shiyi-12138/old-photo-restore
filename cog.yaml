build:
  gpu: true
  python_version: "3.10"
  system_packages:
    - "ffmpeg"
    - "libsm6"
    - "libxext6"
    - "libgl1-mesa-glx"
    - "wget"
    - "bzip2"
    - "unzip"
    - "git"
    - "cmake"
    - "build-essential"
    - "libopenblas-dev"
    - "liblapack-dev"
  run:
    - pip install "cmake<4.0"
    - pip install torch==2.0.1 torchvision==0.15.2 opencv-python==4.8.1.78 numpy==1.24.4 scipy==1.10.1 pillow==10.0.0 dominate==2.9.1 scikit-image==0.21.0 easydict==1.13 PyYAML==6.0.1
    - pip install dlib==19.24.2
    - cd /src/Face_Detection && wget -q http://dlib.net/files/shape_predictor_68_face_landmarks.dat.bz2 && bzip2 -d shape_predictor_68_face_landmarks.dat.bz2
    - cd /src/Face_Enhancement && wget -q https://github.com/microsoft/Bringing-Old-Photos-Back-to-Life/releases/download/v1.0/face_checkpoints.zip && unzip -q face_checkpoints.zip && rm face_checkpoints.zip
    - cd /src/Global && wget -q https://github.com/microsoft/Bringing-Old-Photos-Back-to-Life/releases/download/v1.0/global_checkpoints.zip && unzip -q global_checkpoints.zip && rm global_checkpoints.zip
    - cd /src/Face_Enhancement/models/networks && git clone https://github.com/vacancy/Synchronized-BatchNorm-PyTorch && cp -rf Synchronized-BatchNorm-PyTorch/sync_batchnorm .
    - cd /src/Global/detection_models && git clone https://github.com/vacancy/Synchronized-BatchNorm-PyTorch && cp -rf Synchronized-BatchNorm-PyTorch/sync_batchnorm .
predict: "predict.py:Predictor"
